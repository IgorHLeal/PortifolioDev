  <line x1="1064" y1="528" x2="1360" y2="528" stroke="#1E293B"/>
  <text x="1064" y="580" fill="#60A5FA" font-family="Inter, Arial" font-size="14" font-weight="650">Ver todas as mensagens  →</text>
  <text x="852" y="870" text-anchor="middle" fill="#64748B" font-family="Inter, Arial" font-size="13">Wireframe conceitual do painel administrativo</text>
</svg>
