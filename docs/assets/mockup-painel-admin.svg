    <line x1="340" y1="480" x2="980" y2="480" stroke="#1E293B"/>
    <text x="340" y="532" fill="#E2E8F0" font-size="15">OneNote Knowledge Hub</text><rect x="675" y="512" width="82" height="26" rx="13" fill="#052E16"/><text x="692" y="530" fill="#86EFAC" font-size="12">Publicado</text><text x="818" y="530" fill="#94A3B8" font-size="13">Ontem</text><text x="943" y="530" fill="#60A5FA" font-size="13">Editar</text>
    <line x1="340" y1="556" x2="980" y2="556" stroke="#1E293B"/>
    <text x="340" y="608" fill="#E2E8F0" font-size="15">Diagnóstico de Rede</text><rect x="675" y="588" width="75" height="26" rx="13" fill="#422006"/><text x="692" y="606" fill="#FDE68A" font-size="12">Rascunho</text><text x="818" y="606" fill="#94A3B8" font-size="13">2 dias</text><text x="943" y="606" fill="#60A5FA" font-size="13">Editar</text>
  </g>

  <rect x="1035" y="292" width="355" height="530" rx="18" fill="#111827" stroke="#263449" filter="url(#shadow)"/>
  <text x="1064" y="340" fill="#F8FAFC" font-family="Inter, Arial" font-size="20" font-weight="700">Mensagens recentes</text>
  <circle cx="1075" cy="397" r="7" fill="#2563EB"/><text x="1094" y="392" fill="#E2E8F0" font-family="Inter, Arial" font-size="14" font-weight="650">Empresa Exemplo</text><text x="1094" y="414" fill="#94A3B8" font-family="Inter, Arial" font-size="12">Contato sobre oportunidade .NET</text>
  <line x1="1064" y1="443" x2="1360" y2="443" stroke="#1E293B"/>
