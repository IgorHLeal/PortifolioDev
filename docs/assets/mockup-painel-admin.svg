  </g>
  <line x1="24" y1="820" x2="240" y2="820" stroke="#1E293B"/>
  <text x="58" y="860" fill="#FCA5A5" font-family="Inter, Arial" font-size="15">Sair</text>

  <text x="310" y="62" fill="#F8FAFC" font-family="Inter, Arial" font-size="30" font-weight="750">Visão geral</text>
  <text x="310" y="90" fill="#94A3B8" font-family="Inter, Arial" font-size="14">Gerencie o conteúdo público do seu portfólio.</text>
  <rect x="1194" y="35" width="196" height="46" rx="10" fill="#2563EB"/>
  <text x="1227" y="64" fill="#FFFFFF" font-family="Inter, Arial" font-size="14" font-weight="650">+ Novo projeto</text>

  <g filter="url(#shadow)">
    <rect x="310" y="128" width="250" height="130" rx="16" fill="#111827" stroke="#263449"/>
    <rect x="580" y="128" width="250" height="130" rx="16" fill="#111827" stroke="#263449"/>
    <rect x="850" y="128" width="250" height="130" rx="16" fill="#111827" stroke="#263449"/>
    <rect x="1120" y="128" width="270" height="130" rx="16" fill="#111827" stroke="#263449"/>
  </g>
  <g font-family="Inter, Arial">
    <text x="336" y="168" fill="#94A3B8" font-size="14">Projetos</text><text x="336" y="220" fill="#60A5FA" font-size="38" font-weight="750">5</text>
    <text x="606" y="168" fill="#94A3B8" font-size="14">Tecnologias</text><text x="606" y="220" fill="#4ADE80" font-size="38" font-weight="750">12</text>
    <text x="876" y="168" fill="#94A3B8" font-size="14">Certificados</text><text x="876" y="220" fill="#FBBF24" font-size="38" font-weight="750">8</text>
