<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Mockup do painel administrativo do Portfolio.Dev</title>
  <desc id="desc">Dashboard com menu lateral, indicadores, projetos recentes e mensagens.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#020617" flood-opacity="0.3"/></filter>
  </defs>
  <rect width="1440" height="900" fill="#0F172A"/>
  <rect x="0" y="0" width="265" height="900" fill="#0B1120"/>
  <circle cx="42" cy="42" r="18" fill="#2563EB"/>
  <text x="72" y="50" fill="#F8FAFC" font-family="Inter, Arial" font-size="22" font-weight="700">Portfolio.Dev</text>
  <text x="28" y="102" fill="#64748B" font-family="Inter, Arial" font-size="12" font-weight="700">ADMINISTRAÇÃO</text>
  <rect x="18" y="122" width="229" height="48" rx="10" fill="#172554"/>
  <text x="58" y="152" fill="#93C5FD" font-family="Inter, Arial" font-size="15" font-weight="650">Visão geral</text>
