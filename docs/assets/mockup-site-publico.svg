  <text x="293" y="365" fill="#93C5FD" font-family="Inter, Arial" font-size="15" font-weight="650">Baixar currículo</text>

  <circle cx="1180" cy="260" r="112" fill="#172554" stroke="#2563EB" stroke-width="3"/>
  <circle cx="1180" cy="237" r="42" fill="#334155"/>
  <path d="M1116 331c12-55 116-55 128 0" fill="#334155"/>
  <rect x="1090" y="350" width="64" height="27" rx="13" fill="#1E293B" stroke="#334155"/>
  <text x="1109" y="368" fill="#93C5FD" font-family="Inter, Arial" font-size="12">.NET</text>
