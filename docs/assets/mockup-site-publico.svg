    <text x="534" y="886" fill="#60A5FA" font-size="14" font-weight="650">Ver estudo de caso  →</text>

    <rect x="990" y="750" width="92" height="27" rx="13" fill="#172554"/><text x="1010" y="768" fill="#93C5FD" font-size="12">PROJETO</text>
    <text x="990" y="814" fill="#F8FAFC" font-size="21" font-weight="700">Portfolio.Dev</text>
    <text x="990" y="844" fill="#94A3B8" font-size="14">.NET, React, SQL Server e Azure.</text>
    <text x="990" y="886" fill="#60A5FA" font-size="14" font-weight="650">Ver estudo de caso  →</text>
