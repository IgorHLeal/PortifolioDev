    <text x="346" y="563" fill="#60A5FA" font-size="15" font-weight="650">BANCO</text><text x="346" y="594" fill="#E2E8F0" font-size="18">SQL Server · EF Core</text>
    <text x="614" y="563" fill="#60A5FA" font-size="15" font-weight="650">INTEGRAÇÕES</text><text x="614" y="594" fill="#E2E8F0" font-size="18">RabbitMQ · APIs</text>
    <text x="882" y="563" fill="#60A5FA" font-size="15" font-weight="650">FRONT-END</text><text x="882" y="594" fill="#E2E8F0" font-size="18">React · TypeScript</text>
    <text x="1150" y="563" fill="#60A5FA" font-size="15" font-weight="650">CLOUD</text><text x="1150" y="594" fill="#E2E8F0" font-size="18">Docker · Azure</text>
  </g>

  <text x="54" y="700" fill="#F8FAFC" font-family="Inter, Arial" font-size="28" font-weight="700">Projetos em destaque</text>
