<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980" role="img" aria-labelledby="title desc">
  <title id="title">Mockup da página pública do Portfolio.Dev</title>
  <desc id="desc">Representação visual do cabeçalho, hero, tecnologias, experiência, projetos e contato.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172554"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1440" height="980" fill="url(#bg)"/>

  <rect x="0" y="0" width="1440" height="76" fill="#0B1120"/>
  <circle cx="74" cy="38" r="19" fill="#2563EB"/>
  <text x="106" y="46" fill="#F8FAFC" font-family="Inter, Arial" font-size="24" font-weight="700">Igor Leal.dev</text>
  <g fill="#CBD5E1" font-family="Inter, Arial" font-size="15">
    <text x="786" y="44">Sobre</text>
    <text x="856" y="44">Tecnologias</text>
    <text x="964" y="44">Experiência</text>
    <text x="1074" y="44">Projetos</text>
    <text x="1155" y="44">Certificados</text>
    <text x="1260" y="44">Contato</text>
  </g>

  <rect x="54" y="110" width="1332" height="300" rx="24" fill="url(#hero)" stroke="#1E3A8A" filter="url(#shadow)"/>
  <rect x="100" y="152" width="220" height="30" rx="15" fill="#052E16" stroke="#22C55E"/>
  <circle cx="121" cy="167" r="5" fill="#22C55E"/>
  <text x="137" y="173" fill="#86EFAC" font-family="Inter, Arial" font-size="13">Disponível para oportunidades</text>
  <text x="100" y="230" fill="#F8FAFC" font-family="Inter, Arial" font-size="50" font-weight="750">Igor Leal</text>
  <text x="100" y="270" fill="#60A5FA" font-family="Inter, Arial" font-size="25" font-weight="600">Analista de Sistemas e Desenvolvedor .NET</text>
  <text x="100" y="308" fill="#CBD5E1" font-family="Inter, Arial" font-size="16">Soluções por meio de desenvolvimento, análise, automação e documentação.</text>
  <rect x="100" y="336" width="152" height="46" rx="10" fill="#2563EB"/>
  <text x="129" y="365" fill="#FFFFFF" font-family="Inter, Arial" font-size="15" font-weight="650">Ver projetos</text>
